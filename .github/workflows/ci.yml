name: CI

on:
  push:
    branches: [main, codex/mvp]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Type-check · Build (web, admin, mobile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # version read from package.json "packageManager"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turborepo runs each task across every workspace that defines it:
      #   web + admin-dashboard + mobile-app + shared packages.
      - name: Lint
        run: pnpm turbo lint

      - name: Type-check
        run: pnpm turbo check-types

      # Builds web + admin (mobile-app has no web build step in CI).
      # Supabase env is optional here — the api-client falls back to a
      # placeholder client so builds succeed without secrets.
      - name: Build
        run: pnpm turbo build
